name: Portfolio quality

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio/**"
      - "sitemap.xml"
      - "scripts/check_portfolio.py"
      - "requirements-checks.txt"
      - ".github/workflows/portfolio-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio/**"
      - "sitemap.xml"
      - "scripts/check_portfolio.py"
      - "requirements-checks.txt"
      - ".github/workflows/portfolio-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked checker dependencies
        run: python -m pip install --require-hashes -r requirements-checks.txt
      - name: Validate HTML, links and metadata
        run: python scripts/check_portfolio.py
      - name: Check portfolio JavaScript syntax
        run: node --check portfolio/assets/js/portfolio.v1.js
