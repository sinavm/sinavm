name: Portfolio quality

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "svm-ping.html"
      - "portfolio/**"
      - "sitemap.xml"
      - "scripts/check_portfolio.py"
      - "requirements-checks.txt"
      - ".github/workflows/portfolio-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio/**"
      - "sitemap.xml"
      - "scripts/check_portfolio.py"
      - "requirements-checks.txt"
      - ".github/workflows/portfolio-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked checker dependencies
        run: python -m pip install --require-hashes -r requirements-checks.txt
      - name: Validate HTML, links and metadata
        run: python scripts/check_portfolio.py
      - name: Check portfolio JavaScript syntax
        run: node --check portfolio/assets/js/portfolio.v1.js
