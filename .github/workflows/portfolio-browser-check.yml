name: Portfolio browser checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio/**"
      - "scripts/check_browser.py"
      - "requirements-browser.txt"
      - ".github/workflows/portfolio-browser-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio/**"
      - "scripts/check_browser.py"
      - "requirements-browser.txt"
      - ".github/workflows/portfolio-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked browser-test dependencies
        run: python -m pip install --require-hashes -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Serve static site and run browser checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          SITE_BASE_URL=http://127.0.0.1:8765/ python scripts/check_browser.py
