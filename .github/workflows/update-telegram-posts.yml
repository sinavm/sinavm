name: Update Telegram Posts

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - "telegram_script.py"
      - ".github/workflows/update-telegram-posts.yml"

concurrency:
  group: update-telegram-posts
  cancel-in-progress: false

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Run telegram_script.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python telegram_script.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'sinavm'
          git config --global user.email 'sinabb.2006@gmail.com'
          git add telegram-posts.html posts_formatted.json media || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram posts and media"
            git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            echo "Unable to push Telegram updates after 5 attempts"
            exit 1
          else
            echo "No Telegram changes to commit"
          fi

      - name: Trigger melishekan sync
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "no PAT"; exit 0; }
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/sinavm/melishekan/dispatches \
            -d '{"event_type":"sync-nv"}'
          echo "melishekan dispatch sent"
