name: Optimize homepage logo
on:
  push:
    paths:
      - ".github/workflows/optimize-logo.yml"
      - "logo/sinavm_logo_1.jpg"
      - "index.html"
permissions:
  contents: write
concurrency:
  group: optimize-homepage-logo
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install Pillow
      - name: Generate responsive WebP
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          source = ImageOps.exif_transpose(Image.open("logo/sinavm_logo_1.jpg")).convert("RGB")
          source.thumbnail((180, 182), Image.Resampling.LANCZOS)
          source.save("logo/sinavm_logo_1.webp", "WEBP", quality=76, method=6)
          PY
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo/sinavm_logo_1.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize homepage logo for mobile"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            echo "Unable to push optimized logo after 5 attempts"
            exit 1
          fi
